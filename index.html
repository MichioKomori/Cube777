<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7x7x7 ルービックキューブ（直感ドラッグ完全修正版）</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      margin: 0;
      overflow-x: hidden;
    }
    h1 { margin: 5px 0; font-size: 24px; }
    p { color: #aaa; font-size: 13px; margin: 0 0 10px 0; text-align: center; line-height: 1.4; }
    
    /* 3D表示エリア */
    #canvas-container {
      width: 100%;
      max-width: 550px;
      height: 440px;
      background-color: #1a1a1a;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      margin-bottom: 15px;
    }

    /* コントロールUI */
    .controls-section {
      width: 100%;
      max-width: 750px;
      text-align: center;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
      background-color: #222;
      padding: 6px;
      border-radius: 6px;
    }
    .row-label {
      font-size: 12px;
      font-weight: bold;
      color: #00ffcc;
      margin-bottom: 5px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
    }
    button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      padding: 0 6px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 10.5px;
      transition: background 0.2s;
    }
    button:hover { background-color: #444; border-color: #0095cf; }
    button:active { background-color: #555; }
    
    /* 設定項目エリア */
    .system-setting-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #222;
      padding: 10px;
      border-radius: 6px;
    }
    .count-input {
      width: 60px;
      height: 34px;
      background-color: #444;
      color: #fff;
      border: 1px solid #666;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
    }
    .system-btn {
      background-color: #0076a3;
      border-color: #0095cf;
      height: 36px;
      padding: 0 24px;
      font-size: 14px;
      border-radius: 6px;
    }
    .system-btn:hover { background-color: #0095cf; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <h1>7x7x7 Cube Ultimate Control</h1>
  <p>
    【ボタン操作】日本語ボタンで各層を確実にデジタル回転（全42ボタン完備）<br>
    【SHIFT ＋ ドラッグ】回したい層を画面上で直接掴んで直感回転！ / 【通常ドラッグ】全体の視点変更
  </p>

  <div id="canvas-container"></div>

  <div class="controls-section">
    <div id="dynamic-buttons"></div>

    <div class="system-setting-row">
      <span>スクランブル回数:</span>
      <input type="number" id="scramble-count" class="count-input" min="1" max="100" value="40">
      <button class="system-btn" onclick="scramble()">🎲 スクランブル実行</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let cubies = [];
    let isAnimating = false;

    // マウスドラッグ制御用の変数
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let selectedCubie = null;   
    let clickedNormal = null;   
    let startMousePos = { x: 0, y: 0 };

    const colorCodes = {
      R: 0xb71234, L: 0xff5800, U: 0xffffff, D: 0xffd700, F: 0x009b48, B: 0x0046ad, internal: 0x151515
    };

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1000);
      camera.position.set(70, 70, 120); 

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableZoom = true;
      controls.enablePan = false; 
      controls.minDistance = 60;
      controls.maxDistance = 220;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      
      const light1 = new THREE.DirectionalLight(0xffffff, 0.6);
      light1.position.set(60, 90, 60);
      scene.add(light1);

      const light2 = new THREE.DirectionalLight(0xffffff, 0.4);
      light2.position.set(-60, -50, -60);
      scene.add(light2);

      buildCube();
      createUIButtons();

      // ポインターイベントを先行キャプチャして登録
      renderer.domElement.addEventListener('pointerdown', onPointerDown, true);
      renderer.domElement.addEventListener('pointerup', onPointerUp, true);

      animate();
    }

    // 7x7x7の立体構築 (343個のキュービー)
    function buildCube() {
      const mats = {
        R: new THREE.MeshStandardMaterial({ color: colorCodes.R, roughness: 0.1 }),
        L: new THREE.MeshStandardMaterial({ color: colorCodes.L, roughness: 0.1 }),
        U: new THREE.MeshStandardMaterial({ color: colorCodes.U, roughness: 0.1 }),
        D: new THREE.MeshStandardMaterial({ color: colorCodes.D, roughness: 0.1 }),
        F: new THREE.MeshStandardMaterial({ color: colorCodes.F, roughness: 0.1 }),
        B: new THREE.MeshStandardMaterial({ color: colorCodes.B, roughness: 0.1 }),
        internal: new THREE.MeshStandardMaterial({ color: colorCodes.internal, roughness: 0.5 })
      };

      const size = 9.2; 
      const geom = new THREE.BoxGeometry(size, size, size);
      
      for (let x = -3; x <= 3; x++) {
        for (let y = -3; y <= 3; y++) {
          for (let z = -3; z <= 3; z++) {
            const cubieMaterials = [
              x === 3  ? mats.R : mats.internal, 
              x === -3 ? mats.L : mats.internal, 
              y === 3  ? mats.U : mats.internal, 
              y === -3 ? mats.D : mats.internal, 
              z === 3  ? mats.F : mats.internal, 
              z === -3 ? mats.B : mats.internal  
            ];
            const cubie = new THREE.Mesh(geom, cubieMaterials);
            cubie.position.set(x * 10, y * 10, z * 10);
            scene.add(cubie);
            cubies.push(cubie);
          }
        }
      }
    }

    // 日本語操作ボタンの生成
    function createUIButtons() {
      const container = document.getElementById('dynamic-buttons');
      const configs = [
        { axis: 'X', title: '左右の層（右から見て）', layers: ['最左層', '左2層', '左3層', '中央層', '右3層', '右2層', '最右層'] },
        { axis: 'Y', title: '上下の層（上から見て）', layers: ['最下層', '下2層', '下3層', '中央層', '上3層', '上2層', '最上層'] },
        { axis: 'Z', title: '前後の層（前から見て）', layers: ['最後層', '後2層', '後3層', '中央層', '前3層', '前2層', '最前層'] }
      ];

      configs.forEach(cfg => {
        const row = document.createElement('div');
        row.className = 'btn-row';
        row.innerHTML = `<div class="row-label">${cfg.title}</div>`;
        const group = document.createElement('div');
        group.className = 'btn-group';

        cfg.layers.forEach((layerName, layerIdx) => {
          const btnCw = document.createElement('button');
          btnCw.innerText = `${layerName} ↻`;
          btnCw.onclick = () => makeMoveAnimatedButton(cfg.axis, layerIdx, true);
          
          const btnCcw = document.createElement('button');
          btnCcw.innerText = `${layerName} ↺`;
          btnCcw.onclick = () => makeMoveAnimatedButton(cfg.axis, layerIdx, false);

          group.appendChild(btnCw);
          group.appendChild(btnCcw);
        });
        row.appendChild(group);
        container.appendChild(row);
      });

      // 方向変換ボタン
      const globalRow = document.createElement('div');
      globalRow.className = 'btn-row';
      globalRow.innerHTML = `<div class="row-label">全体の方向変換（持ち替え）</div>`;
      const globalGroup = document.createElement('div');
      globalGroup.className = 'btn-group';

      const globals = [
        { axis: 'X', name: '全体を縦に' }, { axis: 'Y', name: '全体を横に' }, { axis: 'Z', name: '全体を傾ける' }
      ];

      globals.forEach(g => {
        const btnCw = document.createElement('button');
        btnCw.innerText = `${g.name} ↻`;
        btnCw.style.backgroundColor = '#444';
        btnCw.onclick = () => makeMoveAnimatedButton(g.axis, -1, true);
        
        const btnCcw = document.createElement('button');
        btnCcw.innerText = `${g.name} ↺`;
        btnCcw.style.backgroundColor = '#444';
        btnCcw.onclick = () => makeMoveAnimatedButton(g.axis, -1, false);

        globalGroup.appendChild(btnCw);
        globalGroup.appendChild(btnCcw);
      });
      globalRow.appendChild(globalGroup);
      container.appendChild(globalRow);
    }

    // レイヤー位置判定関数
    function getCheckFn(axisName, layerIdx) {
      if (layerIdx === -1) return () => true; 
      return (p) => {
        let val = (axisName === 'X') ? p.x : (axisName === 'Y') ? p.y : p.z;
        if (layerIdx === 6) return val > 25;
        if (layerIdx === 5) return val > 15 && val < 25;
        if (layerIdx === 4) return val > 5 && val < 15;
        if (layerIdx === 3) return val > -5 && val < 5; 
        if (layerIdx === 2) return val > -15 && val < -5;
        if (layerIdx === 1) return val > -25 && val < -15;
        if (layerIdx === 0) return val < -25;
        return false;
      };
    }

    // ボタン用の回転アニメーション関数
    function makeMoveAnimatedButton(axisName, layerIdx, cw) {
      if (isAnimating) return;
      isAnimating = true;

      const targetGroup = new THREE.Group();
      scene.add(targetGroup);

      let axis = new THREE.Vector3();
      if (axisName === 'X') axis.set(1, 0, 0);
      if (axisName === 'Y') axis.set(0, 1, 0);
      if (axisName === 'Z') axis.set(0, 0, 1);

      const checkFn = getCheckFn(axisName, layerIdx);

      cubies.forEach(cubie => {
        const worldPos = new THREE.Vector3();
        cubie.getWorldPosition(worldPos);
        if (checkFn(worldPos)) targetGroup.attach(cubie);
      });

      const targetAngle = (cw ? -90 : 90) * Math.PI / 180;
      let currentAngle = 0;
      const speed = 0.15;

      function renderFrame() {
        let step = (cw ? -1 : 1) * speed;
        if (Math.abs(currentAngle + step) >= Math.abs(targetAngle)) {
          step = targetAngle - currentAngle;
          targetGroup.rotateOnAxis(axis, step);
          while(targetGroup.children.length > 0) scene.attach(targetGroup.children[0]);
          scene.remove(targetGroup);
          isAnimating = false;
        } else {
          targetGroup.rotateOnAxis(axis, step);
          currentAngle += step;
          requestAnimationFrame(renderFrame);
        }
      }
      renderFrame();
    }

    // ポクターイベント：PointerDown処理
    function onPointerDown(event) {
      if (isAnimating) return;
      if (!event.shiftKey) return; 

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cubies);

      if (intersects.length > 0) {
        event.stopImmediatePropagation();
        event.preventDefault();
        controls.enabled = false; 

        selectedCubie = intersects[0].object;
        startMousePos = { x: event.clientX, y: event.clientY };

        let normal = intersects[0].face.normal.clone();
        let normalMatrix = new THREE.Matrix3().getNormalMatrix(selectedCubie.matrixWorld);
        clickedNormal = normal.applyMatrix3(normalMatrix).normalize();
      }
    }

    // ポインターイベント：PointerUp処理
    function onPointerUp(event) {
      if (!selectedCubie) {
        controls.enabled = true;
        return;
      }

      event.stopImmediatePropagation();
      event.preventDefault();

      let dx = event.clientX - startMousePos.x;
      let dy = event.clientY - startMousePos.y;
      let distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 20) {
        selectedCubie = null;
        controls.enabled = true;
        return;
      }

      let camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
      let camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
      let dragVector = new THREE.Vector3()
        .addScaledVector(camRight, dx)
        .addScaledVector(camUp, -dy)
        .normalize();

      let rotAxis = new THREE.Vector3().crossVectors(clickedNormal, dragVector);

      let absX = Math.abs(rotAxis.x);
      let absY = Math.abs(rotAxis.y);
      let absZ = Math.abs(rotAxis.z);

      let max = Math.max(absX, absY, absZ);
      let finalAxis = new THREE.Vector3();
      let moveType = '';
      let posValue = 0;

      const worldPos = new THREE.Vector3();
      selectedCubie.getWorldPosition(worldPos);

      if (max === absX) {
        finalAxis.set(1, 0, 0); moveType = 'X'; posValue = worldPos.x;
      } else if (max === absY) {
        finalAxis.set(0, 1, 0); moveType = 'Y'; posValue = worldPos.y;
      } else {
        finalAxis.set(0, 0, 1); moveType = 'Z'; posValue = worldPos.z;
      }

      let dot = rotAxis.dot(finalAxis);
      
      // 🛠️【今回の超重要修正】
      // dot < 0 を dot > 0 に変更。これでドラッグした方向にパーツがそのまま動く直感的な挙動になります。
      let cw = dot > 0; 

      executeMoveMouse(moveType, posValue, cw, finalAxis);
      
      selectedCubie = null;
      controls.enabled = true; 
    }

    // マウスドラッグ専用の回転アニメーション関数
    function executeMoveMouse(moveType, posValue, cw, axis) {
      if (isAnimating) return;
      isAnimating = true;

      const targetGroup = new THREE.Group();
      scene.add(targetGroup);

      cubies.forEach(cubie => {
        const p = new THREE.Vector3();
        cubie.getWorldPosition(p);
        let isSameLayer = false;

        if (moveType === 'X' && Math.abs(p.x - posValue) < 2) isSameLayer = true;
        if (moveType === 'Y' && Math.abs(p.y - posValue) < 2) isSameLayer = true;
        if (moveType === 'Z' && Math.abs(p.z - posValue) < 2) isSameLayer = true;

        if (isSameLayer) targetGroup.attach(cubie);
      });

      const targetAngle = (cw ? 90 : -90) * Math.PI / 180;
      let currentAngle = 0;
      const speed = 0.15;

      function renderFrame() {
        let step = (cw ? 1 : -1) * speed;
        if (Math.abs(currentAngle + step) >= Math.abs(targetAngle)) {
          step = targetAngle - currentAngle;
          targetGroup.rotateOnAxis(axis, step);
          while(targetGroup.children.length > 0) scene.attach(targetGroup.children[0]);
          scene.remove(targetGroup);
          isAnimating = false;
        } else {
          targetGroup.rotateOnAxis(axis, step);
          currentAngle += step;
          requestAnimationFrame(renderFrame);
        }
      }
      renderFrame();
    }

    // スクランブル用
    function makeMoveInstant(axisName, layerVal, cw) {
      const targetGroup = new THREE.Group();
      scene.add(targetGroup);
      let axis = new THREE.Vector3();
      if (axisName === 'X') axis.set(1, 0, 0);
      if (axisName === 'Y') axis.set(0, 1, 0);
      if (axisName === 'Z') axis.set(0, 0, 1);

      cubies.forEach(cubie => {
        const p = new THREE.Vector3();
        cubie.getWorldPosition(p);
        let match = false;
        if (axisName === 'X' && Math.abs(p.x - layerVal) < 2) match = true;
        if (axisName === 'Y' && Math.abs(p.y - layerVal) < 2) match = true;
        if (axisName === 'Z' && Math.abs(p.z - layerVal) < 2) match = true;
        if (match) targetGroup.attach(cubie);
      });

      targetGroup.rotateOnAxis(axis, (cw ? 90 : -90) * Math.PI / 180);
      targetGroup.updateMatrixWorld(true);
      while(targetGroup.children.length > 0) scene.attach(targetGroup.children[0]);
      scene.remove(targetGroup);
    }

    function scramble() {
      if (isAnimating) return;
      
      const countInput = document.getElementById('scramble-count');
      let count = parseInt(countInput.value, 10);
      if (isNaN(count) || count < 1) count = 1;
      if (count > 100) count = 100; 
      countInput.value = count;

      const axes = ['X', 'Y', 'Z'];
      const layers = [-30, -20, -10, 0, 10, 20, 30];
      
      for (let i = 0; i < count; i++) {
        let rAxis = axes[Math.floor(Math.random() * 3)];
        let rLayer = layers[Math.floor(Math.random() * 7)];
        let rCw = Math.random() > 0.5;
        makeMoveInstant(rAxis, rLayer, rCw);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    window.onload = init;
  </script>
</body>
</html>
